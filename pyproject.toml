[project]
name = "jarvis"
version = "0.2.0"
description = "Jarvis — assistente pessoal por voz (edge de áudio local + core com Claude via setup-token)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "websockets>=13",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Edge: captura/playback de áudio, AEC, wake-word, VAD, bandeja e notificações.
# Roda nativo no Linux ou no Windows (quando o core está no WSL).
edge = [
    "sounddevice>=0.5",
    "onnxruntime>=1.18",
    "openwakeword>=0.6",
    "livekit>=1.0",
    "desktop-notifier>=6",
    "pystray>=0.19",
    "pillow>=10",
]
# Core: STT, TTS, cérebro (Haiku) e workers (Sonnet/Opus) via Claude Agent SDK.
core = [
    "claude-agent-sdk>=0.1.0",
    "sherpa-onnx>=1.12",
    "kokoro-onnx>=0.4",
    "piper-tts>=1.2",
    "soundfile>=0.12",
]
# Bandeja no Linux/Wayland (StatusNotifierItem via appindicator). Requer libayatana-appindicator e
# gobject-introspection do sistema para compilar.
tray = ["pygobject<3.51; sys_platform == 'linux'"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-edge = "jarvis.edge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["slow: testes que baixam modelos / rodam inferência"]
